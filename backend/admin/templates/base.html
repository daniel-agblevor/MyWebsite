<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}Site administration{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% if g.admin_claims %}
  <header class="admin-header">
    <a class="brand" href="{{ url_for('admin_pages.dashboard') }}">Daniel Yao Agblevor <span>Admin</span></a>
    <nav aria-label="Admin navigation">
      <a href="{{ url_for('admin_pages.dashboard') }}">Leads</a>
      <a href="{{ url_for('admin_pages.content', kind='services') }}">Content</a>
      <form method="post" action="{{ url_for('admin_pages.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="text-button" type="submit">Sign out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main id="main" class="admin-main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
